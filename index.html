<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRACKLIST — アルバム並び替えゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14131A;
    --panel:#1E1C26;
    --panel-2:#26232F;
    --plate:#0A0A0C;
    --text:#F2EFE9;
    --muted:#9C97A6;
    --gold:#D4A73D;
    --gold-soft:#8F7A3E;
    --green:#4C9A6A;
    --green-bg:#1D2C22;
    --red:#C6453C;
    --red-bg:#2E1A19;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .screen{display:none;min-height:100vh;}
  #modeScreen.active{display:flex;}
  #gameScreen.active{display:block;}

  /* ---------- Mode Select Screen ---------- */
  #modeScreen{
    flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:40px 20px;text-align:center;
    background:
      radial-gradient(circle at 50% -10%, rgba(212,167,61,0.10), transparent 55%),
      var(--ink);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.25em;
    font-size:12px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  h1.title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(32px,6vw,52px);
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:44px;}

  .vinyl{
    width:180px;height:180px;border-radius:50%;position:relative;margin-bottom:44px;
    background:
      repeating-radial-gradient(circle at center,
        #0c0b10 0px, #0c0b10 2px,
        #17151d 2px, #17151d 4px);
    box-shadow:0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 2px rgba(212,167,61,0.15);
    animation:spin 6s linear infinite;
  }
  .vinyl::after{
    content:'';position:absolute;inset:0;margin:auto;
    width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e6c266, var(--gold-soft) 70%);
    box-shadow:0 0 0 3px var(--ink), 0 0 0 4px rgba(212,167,61,0.4);
  }
  .vinyl::before{
    content:'';position:absolute;inset:0;margin:auto;
    width:10px;height:10px;border-radius:50%;background:var(--ink);z-index:2;
  }
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .vinyl{animation:none} }

  .mode-cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:640px;}
  .mode-card{
    width:260px;background:var(--panel);border:1px solid rgba(255,255,255,0.06);
    border-radius:var(--radius);padding:26px 22px;cursor:pointer;text-align:left;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .mode-card:hover{transform:translateY(-4px);border-color:var(--gold-soft);background:var(--panel-2);}
  .mode-card .tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);
    letter-spacing:.15em;margin-bottom:10px;display:block;
  }
  .mode-card h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 8px;}
  .mode-card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0;}

  /* ---------- Game Screen ---------- */
  #gameScreen{padding:24px 16px 120px;}
  .game-topbar{
    max-width:900px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;
  }
  .back-link{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    background:none;border:none;cursor:pointer;letter-spacing:.05em;
    display:flex;align-items:center;gap:6px;
  }
  .back-link:hover{color:var(--gold);}
  .mode-pill{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);
    border:1px solid var(--gold-soft);border-radius:999px;padding:4px 12px;letter-spacing:.1em;
  }

  .album-head{max-width:900px;margin:0 auto 28px;text-align:center;}
  .album-name{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(24px,4vw,36px);margin:0 0 4px;}
  .album-artist{color:var(--muted);font-size:14px;}

  .game-grid{
    max-width:900px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:36px;
  }
  @media (max-width:720px){ .game-grid{grid-template-columns:1fr;} }

  .cover-wrap{display:flex;flex-direction:column;align-items:center;}
  .cover-img{
    width:100%;max-width:280px;aspect-ratio:1/1;object-fit:cover;border-radius:8px;
    box-shadow:0 18px 40px rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.08);
  }

  .tracklist{display:flex;flex-direction:column;gap:10px;}
  .track-row{
    display:grid;grid-template-columns:52px 1fr 28px;align-items:center;gap:12px;
    border-radius:10px;padding:6px;transition:background .2s ease;
  }
  .track-badge{
    font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;
    background:var(--plate);color:var(--gold);
    height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(212,167,61,0.25), inset 0 2px 4px rgba(0,0,0,0.6);
    letter-spacing:.05em;
  }
  .track-slot{
    min-height:44px;border-radius:8px;background:var(--panel);
    border:1.5px dashed rgba(255,255,255,0.14);
    display:flex;align-items:center;padding:0 4px;
    transition:border-color .15s ease, background .15s ease;
  }
  .track-slot.filled{border-style:solid;border-color:rgba(255,255,255,0.1);}
  .track-slot.dragover{border-color:var(--gold);background:var(--panel-2);}

  .track-input{
    width:100%;min-height:44px;border-radius:8px;background:var(--panel);
    border:1.5px solid rgba(255,255,255,0.14);color:var(--text);
    font-family:'Inter',sans-serif;font-size:14px;padding:0 12px;outline:none;
  }
  .track-input:focus{border-color:var(--gold-soft);}

  .result-mark{font-size:18px;text-align:center;font-family:'IBM Plex Mono',monospace;}

  .track-row.correct{background:var(--green-bg);}
  .track-row.correct .track-slot,.track-row.correct .track-input{border-color:var(--green);color:var(--green);}
  .track-row.correct .result-mark{color:var(--green);}

  .track-row.incorrect{background:var(--red-bg);}
  .track-row.incorrect .track-slot,.track-row.incorrect .track-input{border-color:var(--red);}
  .track-row.incorrect .result-mark{color:var(--red);}
  .answer-reveal{
    grid-column:2 / 3;font-size:12px;color:var(--red);font-family:'IBM Plex Mono',monospace;
    margin-top:-4px;padding-left:2px;display:none;
  }
  .track-row.incorrect .answer-reveal{display:block;}
  .track-row.incorrect{grid-template-rows:auto auto;}

  .block{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:500;
    background:var(--panel-2);border:1px solid rgba(255,255,255,0.12);
    border-radius:8px;padding:10px 12px;cursor:grab;user-select:none;touch-action:none;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .block.dragging{cursor:grabbing;box-shadow:0 12px 30px rgba(0,0,0,0.5);opacity:0.95;}
  .track-slot .block{width:100%;box-shadow:none;background:transparent;border:none;cursor:default;}

  .bank-label{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.15em;
    color:var(--muted);margin:34px 0 12px;text-transform:uppercase;
  }
  #wordBank{
    display:flex;flex-wrap:wrap;gap:10px;min-height:50px;
    max-width:900px;margin:0 auto;padding:14px;background:rgba(255,255,255,0.02);
    border-radius:10px;border:1px dashed rgba(255,255,255,0.08);
  }

  .submit-bar{
    position:fixed;right:20px;bottom:20px;z-index:50;display:none;
  }
  .submit-bar.show{display:block;}

  /* ---------- Summary Screen ---------- */
  #summaryScreen{
    padding:60px 20px 80px;
  }
  #summaryScreen.active{display:flex;justify-content:center;}
  .summary-wrap{width:100%;max-width:640px;text-align:center;}
  .score-block{
    background:var(--panel);border:1px solid rgba(255,255,255,0.06);
    border-radius:var(--radius);padding:28px 24px;margin:22px 0;
  }
  .score-number{
    font-family:'Fraunces',serif;font-weight:700;color:var(--gold);
    font-size:clamp(30px,6vw,44px);line-height:1;margin-bottom:8px;
  }
  .score-label{color:var(--muted);font-size:13px;letter-spacing:.03em;margin-bottom:16px;}
  .detail-toggle-btn{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.08em;
    background:transparent;color:var(--gold);border:1px solid var(--gold-soft);
    border-radius:999px;padding:8px 18px;cursor:pointer;
  }
  .detail-toggle-btn:hover{background:var(--panel-2);}

  .track-detail-list{
    display:none;flex-direction:column;gap:10px;margin-top:20px;text-align:left;
  }
  .track-detail-list.show{display:flex;}
  .perfect-album-list{
    display:flex;flex-wrap:wrap;flex-direction:row;justify-content:center;text-align:center;
    gap:14px;margin-top:20px;
  }

  .detail-card{
    display:flex;align-items:center;gap:12px;
    background:var(--panel-2);border-radius:10px;padding:8px 12px;
  }
  .detail-card img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;}
  .detail-card .detail-text{display:flex;flex-direction:column;}
  .detail-card .detail-track{font-size:13px;font-weight:600;}
  .detail-card .detail-album{font-size:11px;color:var(--muted);}

  .perfect-card{
    width:110px;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .perfect-card img{width:88px;height:88px;border-radius:8px;object-fit:cover;box-shadow:0 8px 18px rgba(0,0,0,0.4);}
  .perfect-card .perfect-name{font-size:12px;color:var(--text);line-height:1.3;}
  .empty-note{color:var(--muted);font-size:12px;text-align:center;padding:10px;}
  .submit-btn{
    font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.05em;
    background:var(--gold);color:#1a1408;border:none;border-radius:999px;
    padding:14px 26px;cursor:pointer;font-weight:600;
    box-shadow:0 10px 24px rgba(212,167,61,0.35);
    transition:transform .15s ease;
  }
  .submit-btn:hover{transform:translateY(-2px);}

  .result-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--panel);border-top:1px solid rgba(255,255,255,0.08);
    padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:20px;
    flex-wrap:wrap;
  }
  .result-score{font-family:'Fraunces',serif;font-size:18px;}
  .result-score b{color:var(--gold);}
  .reset-btn{
    font-family:'IBM Plex Mono',monospace;font-size:13px;
    background:transparent;color:var(--text);border:1px solid var(--gold-soft);
    border-radius:999px;padding:10px 20px;cursor:pointer;
  }
  .reset-btn:hover{background:var(--panel-2);}
</style>
</head>
<body>

  <!-- ============ 画面1：モード選択 ============ -->
  <section id="modeScreen" class="screen active">
    <span class="eyebrow">Track Order Challenge</span>
    <h1 class="title">BackDropCinderella TRACKLIST</h1>
    <p class="subtitle">アルバムを聴き込んだ記憶だけを頼りに、曲順を当てよう</p>
    <div class="vinyl"></div>
    <div class="mode-cards">
      <div class="mode-card" data-mode="easy">
        <span class="tag">MODE 01</span>
        <h2>通常モード</h2>
        <p>下に並んだ曲名ブロックをドラッグして、正しいトラック番号の隣にドロップしよう。</p>
      </div>
      <div class="mode-card" data-mode="hard">
        <span class="tag">MODE 02</span>
        <h2>激ムズモード</h2>
        <p>ヒントなし。トラック番号の横の空欄に、自分で曲名をタイピングして埋めよう。</p>
      </div>
    </div>
  </section>

  <!-- ============ 画面2：ゲーム画面 ============ -->
  <section id="gameScreen" class="screen">
    <div class="game-topbar">
      <button class="back-link" onclick="returnToModeSelect()">← モード選択</button>
      <span class="mode-pill" id="modePill"></span>
    </div>

    <div class="album-head">
      <h2 class="album-name" id="albumName"></h2>
      <div class="album-artist" id="albumArtist"></div>
    </div>

    <div class="game-grid">
      <div class="cover-wrap">
        <img class="cover-img" id="albumCover" src="" alt="album cover" />
      </div>
      <div class="tracklist" id="tracklist"></div>
    </div>

    <div id="bankSection">
      <div class="bank-label">曲名ブロック（ドラッグして空欄へ）</div>
      <div id="wordBank"></div>
    </div>
  </section>

  <!-- ============ 画面3：全アルバム終了後の集計画面 ============ -->
  <section id="summaryScreen" class="screen">
    <div class="summary-wrap">
      <span class="eyebrow">Session Complete</span>
      <h1 class="title" style="font-size:clamp(26px,5vw,40px);">全アルバム終了！</h1>

      <div class="score-block">
        <div class="score-number" id="trackScoreNumber">0 / 0</div>
        <div class="score-label">トラック正解数（1トラック = 1ポイント）</div>
        <button class="detail-toggle-btn" id="detailToggleBtn" onclick="toggleTrackDetail()">概要を見る</button>
        <div class="track-detail-list" id="trackDetailList"></div>
      </div>

      <div class="score-block">
        <div class="score-number" id="albumScoreNumber">0 / 0</div>
        <div class="score-label">アルバム完全正解数（全曲正解 = 1ポイント）</div>
        <div class="perfect-album-list" id="perfectAlbumList"></div>
      </div>

      <button class="reset-btn" style="margin-top:30px;" onclick="returnToModeSelect()">モード選択に戻る</button>
    </div>
  </section>

  <div class="submit-bar" id="submitBar">
    <button class="submit-btn" id="submitBtn" onclick="checkAnswers()">回答する</button>
  </div>

/* ============================================================ */

let currentMode = 'easy';
let currentAlbum = null;
let correctOrder = [];
let submitted = false;
let dragEl = null, offsetX = 0, offsetY = 0, originParent = null;
let usedAlbumIndices = new Set();
let sessionResults = []; // このセッション（モード選択から開始し全アルバムを終えるまで）の各アルバムの結果を記録

const modeScreen = document.getElementById('modeScreen');
const gameScreen = document.getElementById('gameScreen');

document.querySelectorAll('.mode-card').forEach(card=>{
  card.addEventListener('click', ()=> startGame(card.dataset.mode));
});

// まだ出題していないアルバムから選ぶ。全て出題済みなら出題履歴をリセットして再度全体から選ぶ。
function pickRandomAlbum(){
  let available = ALBUMS.map((a,i)=>i).filter(i=>!usedAlbumIndices.has(i));
  if(available.length === 0){
    usedAlbumIndices.clear();
    available = ALBUMS.map((a,i)=>i);
  }
  const idx = available[Math.floor(Math.random()*available.length)];
  usedAlbumIndices.add(idx);
  return ALBUMS[idx];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=> s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(mode){
  currentMode = mode;
  usedAlbumIndices.clear(); // モード選択からの新規セッション開始 → 出題履歴をリセット
  sessionResults = [];

  showScreen('gameScreen');
  document.getElementById('modePill').textContent = mode === 'easy' ? '通常モード' : '	激ムズモード';

  loadAlbum();
}

// 続行ボタンから呼ばれる。モードはそのまま、まだ出ていないアルバムを新たに出題する。
function continueGame(){
  loadAlbum();
}

function loadAlbum(){
  currentAlbum = pickRandomAlbum();
  correctOrder = currentAlbum.tracks;
  submitted = false;

  document.getElementById('albumName').textContent = currentAlbum.name;
  document.getElementById('albumArtist').textContent = currentAlbum.artist || '';
  document.getElementById('albumCover').src = currentAlbum.cover;

  renderTracklist();

  document.getElementById('bankSection').style.display = currentMode === 'easy' ? 'block' : 'none';
  resetSubmitBar();
}

function resetSubmitBar(){
  document.querySelectorAll('.result-bar').forEach(b=>b.remove());
  let bar = document.getElementById('submitBar');
  if(!bar){
    bar = document.createElement('div');
    bar.className = 'submit-bar';
    bar.id = 'submitBar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = '<button class="submit-btn" id="submitBtn" onclick="checkAnswers()">回答する</button>';
  bar.classList.add('show');
}

function renderTracklist(){
  const list = document.getElementById('tracklist');
  list.innerHTML = '';

  correctOrder.forEach((trackName, i)=>{
    const row = document.createElement('div');
    row.className = 'track-row';
    row.dataset.index = i;

    const badge = document.createElement('div');
    badge.className = 'track-badge';
    badge.textContent = String(i+1).padStart(2,'0');

    let answerField;
    if(currentMode === 'easy'){
      answerField = document.createElement('div');
      answerField.className = 'track-slot dropzone';
      answerField.dataset.slot = i;
      attachDropzoneEvents(answerField);
    } else {
      answerField = document.createElement('input');
      answerField.type = 'text';
      answerField.className = 'track-input';
      answerField.placeholder = '曲名を入力';
      answerField.dataset.slot = i;
    }

    const mark = document.createElement('div');
    mark.className = 'result-mark';

    const reveal = document.createElement('div');
    reveal.className = 'answer-reveal';

    row.appendChild(badge);
    row.appendChild(answerField);
    row.appendChild(mark);
    row.appendChild(reveal);
    list.appendChild(row);
  });

  if(currentMode === 'easy'){
    renderWordBank();
  }
}

function renderWordBank(){
  const bank = document.getElementById('wordBank');
  bank.innerHTML = '';
  const shuffled = shuffle(correctOrder.map((name, idx)=>({name, idx})));
  shuffled.forEach(item=>{
    const block = document.createElement('div');
    block.className = 'block';
    block.dataset.name = item.name;
    block.textContent = item.name;
    block.addEventListener('pointerdown', onPointerDown);
    bank.appendChild(block);
  });
}

/* ---------- Drag & Drop (Pointer Events: mouse + touch共通) ---------- */
function attachDropzoneEvents(zone){
  zone.addEventListener('pointerenter', ()=> zone.classList.add('dragover'));
  zone.addEventListener('pointerleave', ()=> zone.classList.remove('dragover'));
}

function onPointerDown(e){
  if(submitted) return;
  const el = e.currentTarget;
  dragEl = el;
  originParent = el.parentElement;
  const rect = el.getBoundingClientRect();
  offsetX = e.clientX - rect.left;
  offsetY = e.clientY - rect.top;

  el.setPointerCapture(e.pointerId);
  el.style.position = 'fixed';
  el.style.width = rect.width + 'px';
  el.style.left = rect.left + 'px';
  el.style.top = rect.top + 'px';
  el.style.zIndex = 1000;
  el.classList.add('dragging');
  document.body.appendChild(el);

  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
}

function onPointerMove(e){
  if(!dragEl) return;
  dragEl.style.left = (e.clientX - offsetX) + 'px';
  dragEl.style.top = (e.clientY - offsetY) + 'px';

  document.querySelectorAll('.track-slot').forEach(z => z.classList.remove('dragover'));
  dragEl.style.display = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  dragEl.style.display = '';
  const zone = under && under.closest ? under.closest('.track-slot') : null;
  if(zone) zone.classList.add('dragover');
}

function onPointerUp(e){
  if(!dragEl) return;
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.querySelectorAll('.track-slot').forEach(z => z.classList.remove('dragover'));

  dragEl.style.position = '';
  dragEl.style.zIndex = '';
  dragEl.style.left = '';
  dragEl.style.top = '';
  dragEl.style.width = '';
  dragEl.classList.remove('dragging');

  dragEl.style.display = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  dragEl.style.display = '';

  const dropzone = under && under.closest ? under.closest('.track-slot') : null;
  const bank = under && under.closest ? under.closest('#wordBank') : null;

  if(dropzone){
    const existing = dropzone.querySelector('.block');
    if(existing && existing !== dragEl){
      // 既に埋まっている場合は、そこにあったブロックを元の場所へ戻して入れ替える
      originParent.appendChild(existing);
      if(originParent.classList && originParent.classList.contains('track-slot')){
        originParent.classList.add('filled');
      }
    } else if(originParent && originParent.classList && originParent.classList.contains('track-slot')){
      originParent.classList.remove('filled');
    }
    dropzone.appendChild(dragEl);
    dropzone.classList.add('filled');
  } else if(bank){
    bank.appendChild(dragEl);
    if(originParent && originParent.classList.contains('track-slot')){
      originParent.classList.remove('filled');
    }
  } else {
    originParent.appendChild(dragEl);
  }
  dragEl = null;
}

/* ---------- 採点 ---------- */
function normalize(s){
  return (s || '').trim().toLowerCase().replace(/\s+/g,'');
}

function checkAnswers(){
  if(submitted) return;
  submitted = true;
  let correctCount = 0;
  let correctTrackNames = [];

  document.querySelectorAll('.track-row').forEach(row=>{
    const i = Number(row.dataset.index);
    const correctName = correctOrder[i];
    let userAnswer = '';

    if(currentMode === 'easy'){
      const slot = row.querySelector('.track-slot');
      const block = slot.querySelector('.block');
      userAnswer = block ? block.dataset.name : '';
    } else {
      const input = row.querySelector('.track-input');
      userAnswer = input.value;
      input.disabled = true;
    }

    const isCorrect = normalize(userAnswer) === normalize(correctName);
    if(isCorrect){
      row.classList.add('correct');
      row.querySelector('.result-mark').textContent = '◯';
      correctCount++;
      correctTrackNames.push(correctName);
    } else {
      row.classList.add('incorrect');
      row.querySelector('.result-mark').textContent = '✕';
      row.querySelector('.answer-reveal').textContent = '正解: ' + correctName;
    }
  });

  document.querySelectorAll('.block').forEach(b=>{
    b.style.pointerEvents = 'none';
    b.style.cursor = 'default';
  });

  sessionResults.push({
    albumName: currentAlbum.name,
    cover: currentAlbum.cover,
    totalTracks: correctOrder.length,
    correctTracks: correctTrackNames,
    allCorrect: correctCount === correctOrder.length
  });

  const isFinalRound = usedAlbumIndices.size === ALBUMS.length;
  showResultBar(correctCount, correctOrder.length, isFinalRound);
}

function showResultBar(correct, total, isFinalRound){
  const bar = document.getElementById('submitBar');
  if(bar) bar.remove();
  const resultBar = document.createElement('div');
  resultBar.className = 'result-bar';

  if(isFinalRound){
    resultBar.innerHTML =
      '<div class="result-score">' + correct + ' / ' + total + ' 正解 <b>' +
      (correct === total ? 'パーフェクト！' : '') + '</b></div>' +
      '<button class="reset-btn" onclick="showFinalSummary()">結果発表を見る</button>';
  } else {
    resultBar.innerHTML =
      '<div class="result-score">' + correct + ' / ' + total + ' 正解 <b>' +
      (correct === total ? 'パーフェクト！' : '') + '</b></div>' +
      '<button class="reset-btn" onclick="continueGame()">続行（次のアルバムへ）</button>' +
      '<button class="reset-btn" onclick="returnToModeSelect()">モード選択に戻る</button>';
  }
  document.body.appendChild(resultBar);
}

function showFinalSummary(){
  document.querySelectorAll('.result-bar').forEach(b=>b.remove());
  const bar = document.getElementById('submitBar');
  if(bar) bar.remove();

  // 1トラックにつき1正解の集計
  const trackTotal = sessionResults.reduce((sum, r)=> sum + r.totalTracks, 0);
  const trackCorrect = sessionResults.reduce((sum, r)=> sum + r.correctTracks.length, 0);
  document.getElementById('trackScoreNumber').textContent = trackCorrect + ' / ' + trackTotal;

  // 1アルバム全問正解につき1正解の集計
  const albumTotal = sessionResults.length;
  const perfectAlbums = sessionResults.filter(r => r.allCorrect);
  document.getElementById('albumScoreNumber').textContent = perfectAlbums.length + ' / ' + albumTotal;

  // 概要：正解した曲を、ジャケット写真・アルバム名・曲名とともに一覧表示
  const detailList = document.getElementById('trackDetailList');
  detailList.innerHTML = '';
  detailList.classList.remove('show');
  document.getElementById('detailToggleBtn').textContent = '概要を見る';

  let hasAnyCorrect = false;
  sessionResults.forEach(r=>{
    r.correctTracks.forEach(trackName=>{
      hasAnyCorrect = true;
      const card = document.createElement('div');
      card.className = 'detail-card';
      card.innerHTML =
        '<img src="' + r.cover + '" alt="" />' +
        '<div class="detail-text">' +
          '<div class="detail-track">' + trackName + '</div>' +
          '<div class="detail-album">' + r.albumName + '</div>' +
        '</div>';
      detailList.appendChild(card);
    });
  });
  if(!hasAnyCorrect){
    detailList.innerHTML = '<div class="empty-note">正解した曲はありませんでした</div>';
  }

  // 完全正解アルバム：ジャケット写真とアルバム名のみ表示
  const perfectList = document.getElementById('perfectAlbumList');
  perfectList.innerHTML = '';
  if(perfectAlbums.length === 0){
    perfectList.innerHTML = '<div class="empty-note">全問正解のアルバムはありませんでした</div>';
  } else {
    perfectAlbums.forEach(r=>{
      const card = document.createElement('div');
      card.className = 'perfect-card';
      card.innerHTML =
        '<img src="' + r.cover + '" alt="" />' +
        '<div class="perfect-name">' + r.albumName + '</div>';
      perfectList.appendChild(card);
    });
  }

  showScreen('summaryScreen');
}

function toggleTrackDetail(){
  const list = document.getElementById('trackDetailList');
  const btn = document.getElementById('detailToggleBtn');
  const isShown = list.classList.toggle('show');
  btn.textContent = isShown ? '概要を閉じる' : '概要を見る';
}

function returnToModeSelect(){
  showScreen('modeScreen');
  document.querySelectorAll('.result-bar').forEach(b=>b.remove());
  const bar = document.getElementById('submitBar');
  if(bar) bar.classList.remove('show');
}
